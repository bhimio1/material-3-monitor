[package]
name = "material_3_monitor"
version = "0.1.0"
edition = "2021"
description = "A Material 3 system monitor for Arch Linux and Hyprland, built with egui"
license = "MIT"

[[bin]]
name = "m3-monitor"
path = "src/main.rs"

[dependencies]
material-3-ui = { git = "https://github.com/bhimio1/material-3-ui", rev = "d1c430aa7feebf86d027f6dce1566b6b9ba4dce0" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk", "user"] }
libc = "0.2"
flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
